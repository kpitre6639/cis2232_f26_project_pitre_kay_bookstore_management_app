# Application name
spring.application.name=bookstore_management_app

# Port configuration
server.port=8080

# Connection settings
spring.datasource.url=jdbc:mysql://localhost:3306/cis2232_bookstore
spring.datasource.username=root
spring.datasource.password=

# Hibernate & JPA optimization
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# UI Template configuration
spring.thymeleaf.cache=false

# Keep your GraphiQL testing configuration active
spring.graphql.graphiql.enabled=true
